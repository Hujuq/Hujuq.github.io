<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>tryout form</title>
  <style>
    body {
      background-color: black;
      color: yellow;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: yellow;
      padding: 20px;
      font-size: 2em;
    }

    form {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      background-color: #333;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    label {
      display: block;
      margin-bottom: 10px;
      color: yellow;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background-color: #222;
      border: 1px solid yellow;
      color: yellow;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: yellow;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #f1c40f;
    }

    .switch-container {
      display: flex;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .switch-container label {
      margin-right: 10px;
      margin-bottom: 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: black;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: yellow;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .conditional {
      display: none;
    }

    .visible {
      display: block;
    }
  </style>
  <script>
    function toggleFields() {
      const isAuto = document.getElementById('autoTryout').checked;
      document.getElementById('youtubeField').style.display = isAuto ? 'block' : 'none';
      document.getElementById('timeFields').style.display = isAuto ? 'none' : 'block';
    }

    window.onload = function() {
      toggleFields(); // run it on page load too
    }
  </script>
</head>
<body>
  <h1>Hello, World!</h1>
  <form action="https://formspree.io/f/xldjqvkw" method="POST">
    <label>
      Your discord username:
      <input type="text" name="username" required>
    </label>

    <label>
      Your rank:
      <input type="text" name="rank" required>
    </label>

    <label>
      What you want to be called?
      <input type="text" name="nickname" required>
    </label>

    <div class="switch-container">
      <label for="autoTryout">Automatic tryout?</label>
      <label class="switch">
        <input type="checkbox" id="autoTryout" name="autoTryout" onchange="toggleFields()" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div id="youtubeField" class="conditional">
      <label>
        YouTube link (trees, walls, ground, double walls):
        <input type="url" name="link">
      </label>
    </div>

    <div id="timeFields" class="conditional">
      <label>
        Available from:
        <input type="time" name="available_from">
      </label>
      <label>
        Available till:
        <input type="time" name="available_till">
      </label>
    </div>

    <button type="submit">Send</button>
  </form>
</body>
</html>
