<!DOCTYPE html>

<html lang="en">
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>tryout form</title>
  <style>
    /* Set black background for the page */
    body {
      background-color: black;
      color: yellow;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Style for the header */
    h1 {
      text-align: center;
      color: yellow;
      padding: 20px;
      font-size: 2em;
    }

    /* Style for the form */
    form {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      background-color: #333;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    /* Style for labels */
    label {
      display: block;
      margin-bottom: 10px;
      color: yellow;
    }

    /* Style for inputs */
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background-color: #222;
      border: 1px solid yellow;
      color: yellow;
      border-radius: 4px;
    }

    /* Style for the submit button */
    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: yellow;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #f1c40f;
    }
  </style>
</head>

<body>
  <h1>
    Hello, World!
  </h1>
  <form
  action="https://formspree.io/f/xldjqvkw"
  method="POST"
  >
    <label>
      Your discord username:
      <input type="text" name="username">
    </label>
    <br>
    <label>
      Your rank:
      <input name="rank">
    </label>
    <br>
    <label>
      (optional) if you want to skip tryout, send youtube link of trees walls ground and double walls
      <input name="link">
    </label>
    <br>
    <label>
      What you want to be called?
      <input name="nickname">
    </label>
    <button type="submit">Send</button>
  </form>
</body>

</html>
