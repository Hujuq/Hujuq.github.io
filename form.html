<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>tryout form</title>
  <style>
    body {
      background-color: black;
      color: yellow;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-size: 2em;
    }

    form {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
      background-color: #333;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      background-color: #222;
      border: 1px solid yellow;
      color: yellow;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: yellow;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #f1c40f;
    }

    .switch-container {
      display: flex;
      align-items: center;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .switch-container label {
      margin-right: 10px;
      margin-bottom: 0;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: black;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: yellow;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .conditional {
      display: none;
    }

    small {
      display: block;
      margin-top: 5px;
      color: #aaa;
    }
  </style>
  <script>
    function toggleFields() {
      const isAuto = document.getElementById('autoTryout').checked;
      document.getElementById('youtubeField').style.display = isAuto ? 'block' : 'none';
      document.getElementById('timeFields').style.display = isAuto ? 'none' : 'block';
    }

    function toUTC(timeStr) {
      if (!timeStr) return '';
      const [hours, minutes] = timeStr.split(":");
      const now = new Date();
      now.setHours(parseInt(hours), parseInt(minutes), 0, 0);
      return now.toISOString().substring(11, 16) + " UTC";
    }

    function convertTimesToUTC(e) {
      const isAuto = document.getElementById('autoTryout').checked;
      if (!isAuto) {
        const from = document.getElementById('fromTime').value;
        const till = document.getElementById('tillTime').value;
        document.getElementById('fromUTC').value = toUTC(from);
        document.getElementById('tillUTC').value = toUTC(till);
      }
    }

    function updateLabels() {
      const from = document.getElementById('fromTime').value;
      const till = document.getElementById('tillTime').value;

      document.getElementById('fromLabel').textContent = from ? 'UTC: ' + toUTC(from) : '';
      document.getElementById('tillLabel').textContent = till ? 'UTC: ' + toUTC(till) : '';
    }

    window.onload = function () {
      toggleFields();
      document.getElementById('tryoutForm').addEventListener('submit', convertTimesToUTC);
    }
  </script>
</head>
<body>
  <h1>Hello, World!</h1>
  <form id="tryoutForm" action="https://formspree.io/f/xldjqvkw" method="POST">
    <label>
      Your discord username:
      <input type="text" name="username" required>
    </label>

    <label>
      Your rank:
      <input type="text" name="rank" required>
    </label>

    <label>
      What you want to be called?
      <input type="text" name="nickname" required>
    </label>

    <div class="switch-container">
      <label for="autoTryout">Automatic tryout?</label>
      <label class="switch">
        <input type="checkbox" id="autoTryout" name="autoTryout" onchange="toggleFields()" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div id="youtubeField" class="conditional">
      <label>
        YouTube link (trees, walls, ground, double walls):
        <input type="url" name="link">
      </label>
    </div>

    <div id="timeFields" class="conditional">
      <label>
        Available from:
        <input type="time" id="fromTime" oninput="updateLabels()">
        <small id="fromLabel"></small>
      </label>
      <label>
        Available till:
        <input type="time" id="tillTime" oninput="updateLabels()">
        <small id="tillLabel"></small>
      </label>
    </div>

    <!-- Hidden UTC-converted time fields -->
    <input type="hidden" name="available_from_utc" id="fromUTC">
    <input type="hidden" name="available_till_utc" id="tillUTC">

    <button type="submit">Send</button>
  </form>
</body>
</html>
